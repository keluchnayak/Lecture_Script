# ==============================================================================
# Render Blueprint Specification for LectureScript Backend API
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: lecturescript-api
    runtime: node
    plan: free
    region: singapore # Closest region to India; matches Neon ap-southeast-1 database
    buildCommand: npm install && npm run build:server
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
      - key: DIRECT_URL
        sync: false # Set securely in Render dashboard (optional, for migrations)
      - key: SESSION_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit secret
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Cloudflare Pages URL: https://<project>.pages.dev
